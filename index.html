<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Firemask animation 2.3">
<!-- ล็อกหน้านี้ไม่ให้โหลดหรือส่งอะไรออกไปนอกเครื่อง: ไม่มีสคริปต์ภายนอก ไม่มีการเชื่อมต่อเครือข่าย -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>HOI4 Flags: resize and convert to TGA</title>
<style>
:root {
  --bg: #1b2527;
  --panel: #233134;
  --panel-2: #2b3b3f;
  --line: #3b4f53;
  --text: #e6dec6;
  --muted: #9eaba3;
  --brass: #c9a65b;
  --brass-dk: #7f6a3a;
  --red: #e08a7c;
  --chk1: #3a4a4d;
  --chk2: #2c393c;
  --font: "Bahnschrift", "DIN Alternate", "Leelawadee UI", "Noto Sans Thai", "Thonburi", Tahoma, sans-serif;
  --code: Consolas, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 var(--font);
  -webkit-font-smoothing: antialiased;
}
code { font-family: var(--code); font-size: .88em; color: var(--text); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 40px 24px 48px; }

/* ตัวเลือกภาษา */
.langbar {
  display: flex; justify-content: flex-end; align-items: center; gap: 8px;
  margin: -16px 0 16px; font-size: .9rem; color: var(--muted);
}
.langbar label { display: inline-flex; align-items: center; gap: 6px; }
.langbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.langbar select {
  min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
}
html:lang(zh-CN) { --font: "Bahnschrift", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; }
html:lang(ja) { --font: "Bahnschrift", "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; }

/* หัวหน้า */
.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 24px; padding-bottom: 24px; border-bottom: 2px solid var(--brass-dk);
}
h1 {
  margin: 0; font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.05;
  font-weight: 700; font-stretch: 80%;
}
.lede { margin: .7rem 0 0; max-width: 44ch; color: var(--muted); font-size: 1.05rem; }
.sizes { color: var(--brass); flex: none; max-width: 100%; height: auto; }
.local {
  margin: 20px 0 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--brass-dk);
  color: var(--muted); font-size: .92rem; max-width: 70ch;
}

/* ส่วนเพิ่มรูปและตั้งค่า */
.setup { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; margin-top: 32px; }
.drop {
  display: flex; flex-direction: column; justify-content: center; gap: 14px;
  padding: 32px 28px; border: 2px dashed var(--line); border-radius: 6px; background: var(--panel);
  transition: border-color .15s, background-color .15s;
}
body.dragging .drop { border-color: var(--brass); background: var(--panel-2); }
.drop h2 { margin: 0; font-size: 1.4rem; line-height: 1.3; }
.hint { margin: 0; color: var(--muted); font-size: .92rem; max-width: 52ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

.settings { display: grid; gap: 22px; align-content: start; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; font-weight: 700; }
.choice { display: grid; gap: 6px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
}
.opt:has(input:checked) { border-color: var(--brass); background: var(--panel-2); }
.opt input { accent-color: var(--brass); margin: .4em 0 0; flex: none; }
.opt small { display: block; color: var(--muted); font-size: .85rem; line-height: 1.45; }

/* ปุ่ม */
.btn {
  font: inherit; font-weight: 700; padding: 9px 18px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--brass); background: transparent; color: var(--text);
}
.btn:hover { background: rgba(201, 166, 91, .12); }
.btn-primary { background: var(--brass); color: #211c10; }
.btn-primary:hover { background: #d8b76c; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:disabled:hover { background: var(--brass); }
.link {
  font: inherit; font-size: .92rem; padding: 4px 2px; border: 0; background: none;
  color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.link:hover { color: var(--text); }

/* รายการธง */
.list-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; margin: 44px 0 12px; }
.list-head h2 { margin: 0; font-size: 1.4rem; }
#flags { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.flag {
  display: grid; grid-template-columns: minmax(200px, 1fr) auto auto;
  grid-template-areas: "name previews actions";
  gap: 18px 32px; align-items: center; padding: 20px 6px; border-bottom: 1px solid var(--line);
}
.flag.has-err { box-shadow: inset 3px 0 0 var(--red); padding-left: 16px; }
.flag-name { grid-area: name; min-width: 0; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.field label { display: block; margin-bottom: 4px; font-size: .85rem; color: var(--muted); }
.field input, .field select, .bulk select {
  min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--text); font: inherit;
}
.field input { width: 8.5em; font-size: 1.15rem; font-weight: 700; }
.field input:focus { border-color: var(--brass); outline: none; }
.field select, .bulk select { font-size: .95rem; cursor: pointer; }
.flag.has-err .field input { border-color: var(--red); }
.out-name { margin: 10px 0 0; font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.out-name strong { color: var(--text); font-size: 1.05rem; }
.meta { margin: 2px 0 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: .92rem; }
.bulk label { color: var(--muted); }
.bulk select { min-height: 36px; padding: 4px 8px; }
.btn-small { padding: 5px 12px; font-size: .92rem; }
.err { margin: 6px 0 0; font-size: .9rem; color: var(--red); }

.previews { grid-area: previews; display: flex; align-items: flex-end; gap: 20px; }
.pv { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.box {
  line-height: 0;
  background: conic-gradient(var(--chk1) 25%, var(--chk2) 0 50%, var(--chk1) 0 75%, var(--chk2) 0) 0 0 / 8px 8px;
}
.pv-large .box { outline: 2px solid var(--brass-dk); }
.box canvas { display: block; image-rendering: pixelated; }
.pv figcaption { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-actions { grid-area: actions; display: flex; flex-direction: column; gap: 8px; }
.edited { margin: 6px 0 0; font-size: .85rem; color: var(--brass); }
.fs-note { margin-top: 8px; font-size: .85rem; }

.empty { margin: 0; padding: 28px 6px; color: var(--muted); border-bottom: 1px solid var(--line); }

/* วิธีใช้ */
.guide { margin-top: 32px; max-width: 72ch; }
.guide summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.guide p { margin: 10px 0 0; color: var(--muted); }

/* สัญญาอนุญาต (โอเพนซอร์ส) */
.legal { max-width: 72ch; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
.legal p { margin: 4px 0 0; font-size: .88rem; color: var(--muted); }
.legal p:first-child { color: var(--text); }

/* แถบดาวน์โหลดด้านล่าง */
.bar { position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid var(--brass-dk); }
.bar .inner {
  max-width: 1040px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
}
#count { font-weight: 700; font-variant-numeric: tabular-nums; }
#status { flex: 1; min-width: 180px; font-size: .9rem; color: var(--muted); }
#status.is-err { color: var(--red); }

@media (max-width: 760px) {
  .setup { grid-template-columns: 1fr; }
  .sizes { width: 200px; }
}
@media (max-width: 600px) {
  .wrap { padding: 28px 16px 40px; }
  .flag { grid-template-columns: 1fr auto; grid-template-areas: "name actions" "previews previews"; gap: 16px; }
  .previews { gap: 16px; flex-wrap: wrap; }
  .bar .inner { padding: 12px 16px; }
}
/* หน้าแก้ไขเลเยอร์ */
dialog.editor {
  width: min(1220px, 96vw); max-width: 96vw; max-height: 94vh; padding: 0;
  border: 1px solid var(--brass-dk); border-radius: 6px; background: var(--bg); color: var(--text);
}
dialog.editor::backdrop { background: rgba(10, 14, 15, .75); }
.ed { display: flex; flex-direction: column; max-height: 94vh; }
.ed-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--line);
}
.ed-head h2 { margin: 0; font-size: 1.2rem; overflow-wrap: anywhere; }
.ed-body {
  display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px;
  padding: 16px 20px; overflow: auto; min-height: 0;
}
.ed-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; margin-bottom: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
.ed-stage-wrap {
  position: relative; display: flex; justify-content: center;
  border: 1px solid var(--line); border-radius: 4px; background: #151d1f;
}
.zoombar {
  position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 2px; padding: 3px;
  border: 1px solid var(--line); border-radius: 6px; background: rgba(27, 37, 39, .92);
}
.zoombar output { min-width: 3.4em; text-align: center; font-size: .85rem; font-variant-numeric: tabular-nums; }
.zoom-fit {
  padding: 5px 9px; border: 0; border-radius: 4px; background: none; color: var(--muted);
  font: inherit; font-size: .82rem; cursor: pointer;
}
.zoom-fit:hover { color: var(--text); background: rgba(201, 166, 91, .12); }
body.dragging dialog[open] .ed-stage-wrap { outline: 2px dashed var(--brass); outline-offset: 3px; }
#ed-stage { display: block; max-width: 100%; max-height: 50vh; width: auto; height: auto; touch-action: none; }
#ed-stage:focus { outline: none; }
#ed-stage:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
.ed-hint { margin: 8px 0 0; font-size: .84rem; line-height: 1.5; color: var(--muted); max-width: 90ch; }
.ed-previews { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; margin-top: 14px; }
.ed-side { display: grid; gap: 20px; align-content: start; min-width: 0; }
.ed-side h3 { margin: 0 0 8px; font-size: 1rem; }
.ed-side h3 .sub { font-weight: 400; font-size: .82rem; color: var(--muted); margin-left: 6px; }
#ed-layers {
  list-style: none; margin: 0; padding: 0; max-height: 236px; overflow: auto;
  border: 1px solid var(--line); border-radius: 4px;
}
.layer { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); }
.layer:last-child { border-bottom: 0; }
.layer.is-sel { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--brass); }
.layer-pick {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 10px;
  border: 0; background: none; color: inherit; font: inherit; font-size: .92rem; text-align: left; cursor: pointer;
}
.layer-pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-pick canvas {
  flex: none; width: 55px; height: 35px; outline: 1px solid var(--line);
  background: conic-gradient(var(--chk1) 25%, var(--chk2) 0 50%, var(--chk1) 0 75%, var(--chk2) 0) 0 0 / 8px 8px;
}
.layer.is-hidden .layer-pick { opacity: .45; }
.layer-tools { display: flex; flex: none; padding-right: 4px; }
.btn-icon {
  display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0;
  border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer;
}
.btn-icon:hover:not(:disabled) { color: var(--text); background: rgba(201, 166, 91, .12); }
.btn-icon:disabled { opacity: .3; cursor: default; }
.btn-icon svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}
.props { display: grid; gap: 12px; }
.sel-name { margin: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prop label, .prop-label { display: block; margin-bottom: 4px; font-size: .82rem; color: var(--muted); }
.prop input[type=number] {
  width: 100%; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--text); font: inherit; font-variant-numeric: tabular-nums;
}
.prop input[type=number]:focus { border-color: var(--brass); outline: none; }
.prop input[type=range] { width: 100%; accent-color: var(--brass); }
.prop input[type=color] {
  width: 64px; height: 36px; padding: 2px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
.check { display: flex; align-items: center; gap: 8px; font-size: .92rem; cursor: pointer; }
.check input { accent-color: var(--brass); width: 16px; height: 16px; }
.ed-foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 12px;
  padding: 12px 20px; border-top: 1px solid var(--line);
}
#ed-status { flex: 1; min-width: 180px; font-size: .88rem; color: var(--muted); }
#ed-status.is-err { color: var(--red); }
@media (max-width: 880px) {
  .ed-body { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  dialog.editor { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
  .ed { height: 100%; max-height: 100dvh; }
  .ed-body { padding: 12px; }
  #ed-stage { max-height: 46vh; }
  #ed-status { flex-basis: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <label for="lang-select">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></svg>
      <span data-i18n="lang.label"></span>
    </label>
    <select id="lang-select"></select>
  </div>

  <header class="top">
    <div>
      <h1 data-i18n="h1"></h1>
      <p class="lede" data-i18n-html="lede"></p>
    </div>
    <svg class="sizes" viewBox="0 0 262 108" width="262" height="108" role="img" data-i18n-aria="sizes.aria">
      <g fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="1" width="131" height="83" fill="currentColor" fill-opacity=".08"/>
        <rect x="150" y="42" width="66" height="42" fill="currentColor" fill-opacity=".08"/>
        <rect x="236" y="73" width="16" height="11" fill="currentColor" fill-opacity=".08"/>
      </g>
      <g fill="currentColor" font-size="13" text-anchor="middle" font-family="Bahnschrift, 'DIN Alternate', Tahoma, sans-serif">
        <text x="66.5" y="104">82×52</text>
        <text x="183" y="104">41×26</text>
        <text x="244" y="104">10×7</text>
      </g>
    </svg>
  </header>

  <p class="local" data-i18n="local"></p>

  <section class="setup">
    <div class="drop" id="drop">
      <h2 data-i18n="drop.title"></h2>
      <p class="hint" data-i18n="drop.hint"></p>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-files" data-i18n="btn.files"></button>
        <button type="button" class="btn" id="btn-folder" data-i18n="btn.folder"></button>
      </div>
      <input type="file" id="pick-files" accept="image/*,.tga" multiple hidden>
      <input type="file" id="pick-folder" webkitdirectory multiple hidden>
    </div>

    <div class="settings">
      <fieldset>
        <legend data-i18n="mode.legend"></legend>
        <div class="choice">
          <label class="opt"><input type="radio" name="mode" value="stretch" checked><span><span data-i18n="mode.stretch"></span><small data-i18n="mode.stretch.sub"></small></span></label>
          <label class="opt"><input type="radio" name="mode" value="cover"><span><span data-i18n="mode.cover"></span><small data-i18n="mode.cover.sub"></small></span></label>
          <label class="opt"><input type="radio" name="mode" value="contain"><span><span data-i18n="mode.contain"></span><small data-i18n="mode.contain.sub"></small></span></label>
        </div>
        <p class="hint fs-note" data-i18n="mode.note"></p>
      </fieldset>
      <fieldset>
        <legend data-i18n="layout.legend"></legend>
        <div class="choice">
          <label class="opt"><input type="radio" name="layout" value="mod" checked><span><span data-i18n="layout.mod"></span><small data-i18n-html="layout.mod.sub"></small></span></label>
          <label class="opt"><input type="radio" name="layout" value="split"><span><span data-i18n="layout.split"></span><small data-i18n-html="layout.split.sub"></small></span></label>
        </div>
      </fieldset>
    </div>
  </section>

  <section>
    <div class="list-head">
      <h2 data-i18n="list.title"></h2>
      <div class="bulk" id="bulk" hidden>
        <label for="bulk-ideo" data-i18n="bulk.label"></label>
        <select id="bulk-ideo" class="ideo-select"></select>
        <button type="button" class="btn btn-small" id="bulk-apply" data-i18n="bulk.apply"></button>
        <button type="button" class="link" id="clear" data-i18n="bulk.clear"></button>
      </div>
    </div>
    <ul id="flags"></ul>
    <p class="empty" id="empty" data-i18n="list.empty"></p>
  </section>

  <details class="guide">
    <summary data-i18n="guide.summary"></summary>
    <p data-i18n="guide.p1"></p>
    <p data-i18n-html="guide.p2"></p>
    <p data-i18n-html="guide.p3"></p>
    <p data-i18n-html="guide.p4"></p>
    <p data-i18n-html="guide.p5"></p>
  </details>

  <footer class="legal">
    <p data-i18n="legal.oss"></p>
    <p data-i18n="legal.note"></p>
  </footer>
</div>

<div class="bar">
  <div class="inner">
    <span id="count"></span>
    <span id="status" role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-primary" id="download" disabled data-i18n="download"></button>
  </div>
</div>

<dialog class="editor" id="editor" aria-labelledby="ed-title">
  <div class="ed">
    <header class="ed-head">
      <h2 id="ed-title"></h2>
      <button type="button" class="btn-icon" id="ed-close" data-i18n-aria="ed.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="ed-body">
      <div class="ed-main">
        <div class="ed-toolbar">
          <div class="btn-row">
            <button type="button" class="btn btn-small" id="ed-add-img" data-i18n="ed.addImg"></button>
            <button type="button" class="btn btn-small" id="ed-add-rect" data-i18n="ed.addRect"></button>
            <button type="button" class="btn btn-small" id="ed-add-ellipse" data-i18n="ed.addEllipse"></button>
          </div>

// ---- pure:start  (ส่วนนี้ไม่แตะหน้าเว็บ ใช้ทดสอบแยกได้)
const SIZES = [
  { key: 'large',  w: 82, h: 52, scale: 2, sub: '' },
  { key: 'medium', w: 41, h: 26, scale: 2, sub: 'medium/' },
  { key: 'small',  w: 10, h: 7,  scale: 4, sub: 'small/' },

// RGBA (เรียงจากบนลงล่าง) -> TGA 32 บิต ไม่บีบอัด จุดเริ่มมุมซ้ายล่าง แบบเดียวกับที่ GIMP export
function rgbaToTGA(w, h, d) {
  const out = new Uint8Array(18 + w * h * 4);
  out[2] = 2;                       // true-color ไม่บีบอัด
  out[12] = w & 255; out[13] = w >> 8;
  out[14] = h & 255; out[15] = h >> 8;
  out[16] = 32;                     // บิตต่อพิกเซล
  out[17] = 8;                      // alpha 8 บิต, จุดเริ่มมุมซ้ายล่าง
  let o = 18;
  for (let y = h - 1; y >= 0; y--) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      out[o++] = d[i + 2]; out[o++] = d[i + 1]; out[o++] = d[i]; out[o++] = d[i + 3];
    }
  }
  return out;
}

// อ่าน TGA (ไม่บีบอัดหรือ RLE, สี 24/32 บิต หรือขาวดำ 8 บิต) -> RGBA
function decodeTGA(b) {
  if (b.length < 18) throw new Error('tgaShort');
  const idLen = b[0], cmType = b[1], type = b[2];
  const cmLen = b[5] | (b[6] << 8), cmBits = b[7];
  const w = b[12] | (b[13] << 8), h = b[14] | (b[15] << 8), bpp = b[16], desc = b[17];
  if (![2, 3, 10, 11].includes(type)) throw new Error('tgaType');
  const gray = type === 3 || type === 11, rle = type === 10 || type === 11;
  if (gray ? bpp !== 8 : (bpp !== 24 && bpp !== 32)) throw new Error('tgaBits');
  if (!w || !h) throw new Error('tgaSize');

  let p = 18 + idLen + (cmType ? cmLen * Math.ceil(cmBits / 8) : 0);
  const step = bpp >> 3, n = w * h, data = new Uint8ClampedArray(n * 4);
  const useAlpha = bpp === 32 && (desc & 15) > 0;
  const top = (desc & 0x20) !== 0, rtl = (desc & 0x10) !== 0;
  const broken = () => new Error('tgaBroken');
  let k = 0;
  const put = (q) => {
    const x0 = k % w, y0 = (k / w) | 0;
    const x = rtl ? w - 1 - x0 : x0, y = top ? y0 : h - 1 - y0;
    const j = (y * w + x) * 4;
    if (gray) { data[j] = data[j + 1] = data[j + 2] = b[q]; data[j + 3] = 255; }
    else { data[j] = b[q + 2]; data[j + 1] = b[q + 1]; data[j + 2] = b[q]; data[j + 3] = useAlpha ? b[q + 3] : 255; }
    k++;
  };

  if (!rle) {
    if (p + n * step > b.length) throw broken();
    while (k < n) { put(p); p += step; }
  } else {
    while (k < n) {
      if (p >= b.length) throw broken();
      const hd = b[p++], cnt = (hd & 127) + 1;
      if (hd & 128) {
        if (p + step > b.length) throw broken();
        for (let r = 0; r < cnt && k < n; r++) put(p);
        p += step;
      } else {
        if (p + cnt * step > b.length) throw broken();
        for (let r = 0; r < cnt && k < n; r++) { put(p); p += step; }
      }
    }
  }

  // บางโปรแกรมเขียนช่อง alpha เป็นศูนย์ทั้งไฟล์ ถ้าเป็นแบบนั้นให้ถือว่าทึบทั้งหมด
  if (useAlpha) {
    let any = false;
    for (let j = 3; j < data.length; j += 4) if (data[j]) { any = true; break; }
    if (!any) for (let j = 3; j < data.length; j += 4) data[j] = 255;
  }
  return { w, h, data };
}

// ZIP แบบไม่บีบอัด (store) เขียนเองทั้งหมด ไม่ต้องพึ่งไลบรารีภายนอก
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files, when = new Date()) {
  const enc = new TextEncoder();
  const time = (when.getHours() << 11) | (when.getMinutes() << 5) | (when.getSeconds() >> 1);
  const date = ((Math.max(1980, when.getFullYear()) - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, time, true);
    ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

let lang = 'en';
const pluralRules = {};
function t(key, vars = {}) {
  vars = { owner: OWNER, year: COPYRIGHT_YEAR, ...vars };
  let v = I18N[lang]?.[key] ?? I18N.en[key] ?? I18N.th[key] ?? key;
  if (typeof v === 'object') {
    const pr = pluralRules[lang] || (pluralRules[lang] = new Intl.PluralRules(HTML_LANG[lang]));
    v = v[pr.select(vars.n ?? 0)] ?? v.other;
  }
  return v.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
}
const hasKey = (key) => key in I18N[lang] || key in I18N.en;
// ข้อผิดพลาดจากการอ่านไฟล์ส่งมาเป็นรหัส แปลตอนแสดงผล
const errText = (e) => (hasKey('err.' + e.message) ? t('err.' + e.message) : e.message);
function applyStatic(root = document) {
  root.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  root.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
}
// เปิดมาเป็นภาษาอังกฤษเสมอ เว้นแต่ลิงก์ระบุภาษาไว้ เช่น #lang=th
function detectLang() {
  const m = /lang=([a-z]{2})/.exec(location.hash);
  return m && HTML_LANG[m[1]] ? m[1] : 'en';
}

const IMG_EXT = new Set(['png', 'jpg', 'jpeg', 'jfif', 'webp', 'bmp', 'gif', 'avif', 'tga']);
const MAX_SRC = 1024;   // ย่อรูปต้นฉบับใหญ่ ๆ เก็บไว้แค่นี้ ประหยัดหน่วยความจำ

const extOf = (n) => { const i = n.lastIndexOf('.'); return i < 0 ? '' : n.slice(i + 1).toLowerCase(); };
const cleanName = (s) => s.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\.tga$/i, '').trim();
const IDEOLOGIES = ['', 'communism', 'democratic', 'fascism', 'neutrality'];
function ideoOptions() {
  return IDEOLOGIES.map((v) =>
    `<option value="${v}">${v ? `_${v} (${t('ideo.' + v)})` : t('ideo.none')}</option>`).join('');
}
const IDEO_RE = /_(communism|democratic|fascism|neutrality)$/i;
// "GER_fascism" -> { base: "GER", ideo: "fascism" }
function splitName(s) {
  const n = cleanName(s), m = n.match(IDEO_RE);
  return m ? { base: n.slice(0, -m[0].length).trim(), ideo: m[1].toLowerCase() } : { base: n, ideo: '' };
}
// ชื่อไฟล์จริง: แท็ก + คำต่อท้าย (ถ้าพิมพ์คำต่อท้ายไว้ในช่องชื่อ ให้ใช้อันนั้นก่อน)
function fullName(f) {
  const p = splitName(f.input.value), ideo = p.ideo || f.ideo.value;
  return p.base ? p.base + (ideo ? '_' + ideo : '') : '';
}
const currentMode = () => $('input[name=mode]:checked').value;
const currentLayout = () => $('input[name=layout]:checked').value;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctx2d(c) {
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  return x;
}
function say(msg, isErr = false) { statusEl.textContent = msg; statusEl.classList.toggle('is-err', isErr); }

// ย่อทีละครึ่ง รูปเล็กอย่าง 10×7 จะได้ไม่แตกเป็นจุด ๆ
function halveUntil(c, tw, th) {
  while (c.width > tw * 2 || c.height > th * 2) {
    const nw = c.width > tw * 2 ? Math.ceil(c.width / 2) : c.width;
    const nh = c.height > th * 2 ? Math.ceil(c.height / 2) : c.height;
    const n = mk(nw, nh); ctx2d(n).drawImage(c, 0, 0, nw, nh); c = n;
  }
  return c;
}
function shrinkSource(c) {
  while (Math.max(c.width, c.height) > MAX_SRC) {
    const nw = Math.max(1, Math.round(c.width / 2)), nh = Math.max(1, Math.round(c.height / 2));
    const n = mk(nw, nh); ctx2d(n).drawImage(c, 0, 0, nw, nh); c = n;
  }
  return c;
}

function renderInto(out, src, how) {
  const W = out.width, H = out.height, SW = src.width, SH = src.height;
  let sx = 0, sy = 0, sw = SW, sh = SH, dx = 0, dy = 0, dw = W, dh = H;
  if (how === 'cover') {
    const s = Math.max(W / SW, H / SH);
    sw = Math.min(SW, W / s); sh = Math.min(SH, H / s);
    sx = (SW - sw) / 2; sy = (SH - sh) / 2;
  } else if (how === 'contain') {
    const s = Math.min(W / SW, H / SH);
    dw = Math.max(1, Math.min(W, Math.round(SW * s)));
    dh = Math.max(1, Math.min(H, Math.round(SH * s)));
    dx = Math.floor((W - dw) / 2); dy = Math.floor((H - dh) / 2);
  }
  let cur = src;
  if (sx || sy || sw !== SW || sh !== SH) {
    cur = mk(Math.max(1, Math.round(sw)), Math.max(1, Math.round(sh)));
    ctx2d(cur).drawImage(src, sx, sy, sw, sh, 0, 0, cur.width, cur.height);
  }
  cur = halveUntil(cur, dw, dh);
  const x = ctx2d(out);
  x.clearRect(0, 0, W, H);
  x.drawImage(cur, dx, dy, dw, dh);
}

function viaImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imgRead')); };
    img.src = url;
  });
}
async function loadImage(file) {
  let c;
  if (extOf(file.name) === 'tga') {
    const t = decodeTGA(new Uint8Array(await file.arrayBuffer()));
    c = mk(t.w, t.h);
    c.getContext('2d').putImageData(new ImageData(t.data, t.w, t.h), 0, 0);
  } else {
    let img;
    try { img = await createImageBitmap(file); } catch { img = await viaImg(file); }
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) throw new Error('imgSize');
    c = mk(w, h);
    c.getContext('2d').drawImage(img, 0, 0);
    if (img.close) img.close();
  }
  return { canvas: shrinkSource(c), w: c.width, h: c.height };
}

// ---------- เลเยอร์ ----------
// พื้นที่ทำงาน = ธงใหญ่ 82×52 ขยาย 10 เท่า วาดทุกเลเยอร์ลงที่นี่ก่อน แล้วค่อยย่อเป็น 3 ขนาด
const CW = 820, CH = 520, MIN_SIZE = 6;
let layerSeq = 1;
const baseName = (n) => n.replace(/\.[^.]+$/, '') || '';

function makeImageLayer(src, name) {
  return { id: layerSeq++, type: 'image', name, src, x: CW / 2, y: CH / 2, w: CW, h: CH,
    rot: 0, flipX: false, flipY: false, opacity: 1, visible: true, lock: true };
}
function makeShapeLayer(type, n) {
  const base = type === 'rect'
    ? { w: CW, h: CH / 3, color: '#ffffff', lock: false }
    : { w: CH / 2, h: CH / 2, color: '#c8102e', lock: true };
  return { id: layerSeq++, type, name: '', num: n, x: CW / 2, y: CH / 2, rot: 0, flipX: false, flipY: false,
    opacity: 1, visible: true, ...base };
}
// ชื่อเลเยอร์แปลตามภาษาที่เลือก (รูปใช้ชื่อไฟล์, รูปทรงใช้ชื่อ + ลำดับ)
function layerName(L) {
  const base = L.type === 'rect' ? t('ed.rectName', { n: L.num })
    : L.type === 'ellipse' ? t('ed.ellipseName', { n: L.num })
    : (L.name || t('img.default'));
  return L.copy ? `${base} ${t('ed.copy')}` : base;
}
// stretch = ยืดเต็มกรอบ, cover = ครอปให้เต็ม, contain = ย่อให้พอดี
function fitLayer(L, how) {
  const nw = L.type === 'image' ? L.src.width : L.w;
  const nh = L.type === 'image' ? L.src.height : L.h;
  L.x = CW / 2; L.y = CH / 2; L.rot = 0;
  if (how === 'stretch') { L.w = CW; L.h = CH; return; }
  const s = how === 'cover' ? Math.max(CW / nw, CH / nh) : Math.min(CW / nw, CH / nh);
  L.w = nw * s; L.h = nh * s;
}
// รูปที่ถูกย่อมาก ๆ ให้ย่อทีละครึ่งก่อน ภาพจะได้ไม่แตก
const scaledCache = new WeakMap();
function srcFor(L, scale = 1) {
  const s = L.src, tw = L.w * scale, th = L.h * scale;
  if (s.width <= tw * 2 && s.height <= th * 2) return s;
  const key = Math.round(tw) + 'x' + Math.round(th);
  let m = scaledCache.get(s);
  if (!m) { m = new Map(); scaledCache.set(s, m); }
  if (m.has(key)) return m.get(key);
  const c = halveUntil(s, tw, th);
  m.set(key, c);
  if (m.size > 4) m.delete(m.keys().next().value);
  return c;
}
// scale = ขนาดที่วาดจริงต่อ 1 หน่วยธง (ใช้เลือกความละเอียดของรูปตอนซูม)
function drawLayer(c, L, scale = 1) {
  if (!L.visible || L.opacity <= 0) return;
  c.save();
  c.globalAlpha = L.opacity;
  c.translate(L.x, L.y);
  c.rotate(L.rot * Math.PI / 180);
  c.scale(L.flipX ? -1 : 1, L.flipY ? -1 : 1);
  if (L.type === 'image') {
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(srcFor(L, scale), -L.w / 2, -L.h / 2, L.w, L.h);
  } else {
    c.fillStyle = L.color;
    c.beginPath();
    if (L.type === 'rect') c.rect(-L.w / 2, -L.h / 2, L.w, L.h);
    else c.ellipse(0, 0, L.w / 2, L.h / 2, 0, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}
function composite(layers) {
  const c = mk(CW, CH), x = ctx2d(c);
  for (const L of layers) drawLayer(x, L);
  return c;
}
function renderOuts(outs, layers) {
  const comp = composite(layers);
  for (const s of SIZES) renderInto(outs[s.key], comp, 'stretch');
}
function buildPreviews(container) {
  const outs = {};
  for (const s of SIZES) {
    const fig = document.createElement('figure');
    fig.className = 'pv pv-' + s.key;
    const box = document.createElement('div');
    box.className = 'box';
    const c = mk(s.w, s.h);
    c.style.width = s.w * s.scale + 'px';
    c.style.height = s.h * s.scale + 'px';
    box.append(c);
    const cap = document.createElement('figcaption');
    cap.textContent = `${s.w}×${s.h}`;
    fig.append(box, cap);
    container.append(fig);
    outs[s.key] = c;
  }
  return outs;
}

function renderFlag(f) {
  // ธงที่ยังไม่ได้แก้ในหน้าแก้ไข ให้จัดรูปตามตัวเลือก "ถ้าสัดส่วนรูปไม่ตรงกับธง"

function addFlag(filename, img) {
  const id = nextId++;
  const li = document.createElement('li');
  li.className = 'flag';
  li.innerHTML = `
    <div class="flag-name">
      <div class="fields">
        <div class="field">
          <label for="name-${id}" data-i18n="row.tag"></label>
          <input id="name-${id}" type="text" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
          <label for="ideo-${id}" data-i18n="row.ideo"></label>
          <select id="ideo-${id}" class="ideo-select">${ideoOptions()}</select>
        </div>
      </div>
      <p class="out-name"><span data-i18n="row.out"></span> <strong></strong></p>
      <p class="meta"></p>
      <p class="edited" hidden></p>
      <p class="err" hidden></p>
    </div>
    <div class="previews"></div>
    <div class="row-actions">
      <button type="button" class="btn btn-small edit" data-i18n="row.edit"></button>
      <button type="button" class="btn btn-small remove" data-i18n="row.remove"></button>
    </div>`;
  applyStatic(li);
  const input = $('input', li), ideo = $('select', li);
  const parsed = splitName(filename.replace(/\.[^.]+$/, ''));
  input.value = parsed.base;
  ideo.value = parsed.ideo;

  const outs = buildPreviews($('.previews', li));
  const bname = baseName(filename);
  const flag = { id, li, input, ideo, outs, filename, srcW: img.w, srcH: img.h, baseSrc: img.canvas, baseName: bname,
    layers: [makeImageLayer(img.canvas, bname)], edited: false };
  $('.edit', li).addEventListener('click', () => openEditor(flag));
  input.addEventListener('input', refresh);
  ideo.addEventListener('change', refresh);
  // พิมพ์ GER_fascism ในช่องแท็ก -> แยกเป็น GER + เลือก fascism ให้
  input.addEventListener('blur', () => {
    const p = splitName(input.value);
    let changed = false;
    if (p.base !== input.value) { input.value = p.base; changed = true; }
    if (p.ideo && p.ideo !== ideo.value) { ideo.value = p.ideo; changed = true; }
    if (changed) refresh();
  });
  $('.remove', li).addEventListener('click', () => {
    const n = fullName(flag);
    flags.splice(flags.indexOf(flag), 1);
    li.remove();
    refresh();
    say(t('st.removed', { name: n || t('row.unnamed') }));
  });

  flags.push(flag);
  listEl.append(li);
  renderFlag(flag);
}

async function addFiles(list) {
  const files = [...list].filter((f) => IMG_EXT.has(extOf(f.name)) || f.type.startsWith('image/'));
  if (!files.length) { say(t('st.noImages'), true); return; }
  files.sort((a, b) => a.name.localeCompare(b.name));
  const failed = [];
  let added = 0;
  for (const [i, f] of files.entries()) {
    say(t('st.reading', { i: i + 1, n: files.length }));
    try { addFlag(f.name, await loadImage(f)); added++; }
    catch (e) { failed.push(`${f.name} (${errText(e)})`); }
  }
  refresh();
  if (failed.length) say(t('st.added', { n: added }) + t('st.failed', { list: failed.join(', ') }), true);
  else say(t('st.added', { n: added }));
}

function refresh() {
  const names = flags.map(fullName);
  const counts = new Map();
  for (const n of names) {
    const k = n.toLowerCase();
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  let problems = 0;
  flags.forEach((f, i) => {
    const n = names[i];
    let msg = '';

    for (let x = 10; x < CW; x += 10) { c.moveTo(x, 0); c.lineTo(x, CH); }
    for (let y = 10; y < CH; y += 10) { c.moveTo(0, y); c.lineTo(CW, y); }
    c.lineWidth = k; c.strokeStyle = 'rgba(230, 222, 198, .14)'; c.stroke();
  }
  c.lineWidth = 2 * k; c.strokeStyle = '#7f6a3a'; c.strokeRect(0, 0, CW, CH);
  if (ed.guides.length) {
    c.setLineDash([6 * k, 5 * k]); c.lineWidth = 1.5 * k; c.strokeStyle = '#c9a65b';
    for (const g of ed.guides) {
      c.beginPath();
      if (g.axis === 'x') { c.moveTo(g.at, -BIG); c.lineTo(g.at, BIG); }
      else { c.moveTo(-BIG, g.at); c.lineTo(BIG, g.at); }
      c.stroke();
    }
    c.setLineDash([]);
  }
  const L = selLayer();
  if (L) drawSelection(c, L, k);
  renderOuts(edOuts, ed.layers);
}
function drawSelection(c, L, k) {
  const pts = handlePoints(L, k);
  c.lineWidth = 1.5 * k; c.strokeStyle = '#c9a65b';
  c.beginPath();
  [pts[0], pts[2], pts[4], pts[6]].forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)));
  c.closePath(); c.stroke();
  c.beginPath(); c.moveTo(pts[1].x, pts[1].y); c.lineTo(pts[8].x, pts[8].y); c.stroke();
  const s = 5 * k;
  for (const q of pts) {
    c.beginPath();
    if (q.rot) c.arc(q.x, q.y, s * 1.3, 0, Math.PI * 2);
    else c.rect(q.x - s, q.y - s, s * 2, s * 2);
    c.fillStyle = '#1b2527'; c.fill(); c.stroke();
  }
}
addEventListener('resize', draw);

// ---- รายการเลเยอร์ ----
function iconBtn(icon, label, onClick, disabled = false) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn-icon'; b.title = label;
  b.setAttribute('aria-label', label);
  b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`;
  b.disabled = disabled;
  b.addEventListener('click', onClick);
  return b;
}
function renderLayerList() {
  const ol = $('#ed-layers');
  ol.replaceChildren();
  for (let i = ed.layers.length - 1; i >= 0; i--) {
    const L = ed.layers[i];
    const li = document.createElement('li');
    li.className = 'layer' + (L.id === ed.sel ? ' is-sel' : '') + (L.visible ? '' : ' is-hidden');
    const pick = document.createElement('button');
    pick.type = 'button'; pick.className = 'layer-pick';
    pick.setAttribute('aria-pressed', L.id === ed.sel ? 'true' : 'false');
    const th = mk(55, 35), tx = th.getContext('2d');
    tx.scale(th.width / CW, th.height / CH);
    drawLayer(tx, { ...L, visible: true, opacity: Math.max(L.opacity, .35) });
    const nm = document.createElement('span');
    nm.textContent = layerName(L);
    pick.append(th, nm);
    pick.addEventListener('click', () => { flushNudge(); ed.sel = L.id; syncPanels(); draw(); });
    const tools = document.createElement('span');
    tools.className = 'layer-tools';
    tools.append(
      iconBtn(L.visible ? ICON.eye : ICON.eyeOff, t(L.visible ? 'ed.hide' : 'ed.show', { name: layerName(L) }), () => {
        L.visible = !L.visible; commit(); syncPanels(); draw();
      }),
      iconBtn(ICON.up, t('ed.up', { name: layerName(L) }), () => reorder(L, 1), i === ed.layers.length - 1),
      iconBtn(ICON.down, t('ed.down', { name: layerName(L) }), () => reorder(L, -1), i === 0),
    );
    li.append(pick, tools);
    ol.append(li);
  }
  if (!ed.layers.length) {
    const li = document.createElement('li');
    li.className = 'layer';
    const p = document.createElement('p');
    p.className = 'hint'; p.style.cssText = 'padding:10px 12px;margin:0';
    p.textContent = t('ed.noLayers');
    li.append(p);
    ol.append(li);
  }
}
function reorder(L, dir) {
  const i = ed.layers.indexOf(L), j = i + dir;
  if (j < 0 || j >= ed.layers.length) return;
  [ed.layers[i], ed.layers[j]] = [ed.layers[j], ed.layers[i]];
  commit(); syncPanels(); draw();
}

// ---- แผงปรับค่า ----
function setVal(sel, v) {
  const el = $(sel);
  if (document.activeElement !== el) el.value = String(Math.round(v * 10) / 10);
}
function syncProps() {
  const L = selLayer();
  $('#ed-noselect').hidden = !!L;
  $('#ed-propfields').hidden = !L;
  if (!L) return;
  $('#ed-sel-name').textContent = layerName(L);
  setVal('#ed-x', L.x / CW * 100); setVal('#ed-y', L.y / CH * 100);
  setVal('#ed-w', L.w / CW * 100); setVal('#ed-h', L.h / CH * 100);
  setVal('#ed-rot', L.rot);
  $('#ed-op').value = Math.round(L.opacity * 100);
  $('#ed-op-out').textContent = Math.round(L.opacity * 100) + '%';
  $('#ed-lock').checked = L.lock;
  $('#ed-color-field').hidden = L.type === 'image';
  if (L.type !== 'image') $('#ed-color').value = L.color;
}
function syncPanels() { renderLayerList(); syncProps(); updateUndo(); }

function bindNumber(sel, apply) {
  const el = $(sel);
  el.addEventListener('input', () => {
    const L = selLayer(), v = parseFloat(el.value);
    if (!L || !Number.isFinite(v)) return;
    flushNudge(); apply(L, v); syncProps(); draw();
  });
  el.addEventListener('change', () => { if (selLayer()) { commit(); syncPanels(); } });
}
bindNumber('#ed-x', (L, v) => { L.x = v / 100 * CW; });
bindNumber('#ed-y', (L, v) => { L.y = v / 100 * CH; });
bindNumber('#ed-w', (L, v) => { const w = Math.max(MIN_SIZE, v / 100 * CW); if (L.lock) L.h *= w / L.w; L.w = w; });
bindNumber('#ed-h', (L, v) => { const h = Math.max(MIN_SIZE, v / 100 * CH); if (L.lock) L.w *= h / L.h; L.h = h; });
bindNumber('#ed-rot', (L, v) => { L.rot = normDeg(v); });
$('#ed-op').addEventListener('input', (e) => {
  const L = selLayer(); if (!L) return;
  L.opacity = e.target.value / 100;
  $('#ed-op-out').textContent = e.target.value + '%';
  draw();
});
$('#ed-op').addEventListener('change', () => { if (selLayer()) { commit(); renderLayerList(); } });
$('#ed-color').addEventListener('input', (e) => { const L = selLayer(); if (L) { L.color = e.target.value; draw(); } });
$('#ed-color').addEventListener('change', () => { if (selLayer()) { commit(); renderLayerList(); } });
$('#ed-lock').addEventListener('change', (e) => { const L = selLayer(); if (L) { L.lock = e.target.checked; commit(); } });

function editSel(fn, msg) {
  const L = selLayer(); if (!L) return;
  flushNudge(); fn(L); commit(); syncPanels(); draw();
  if (msg) edSay(msg);
}
document.querySelectorAll('[data-fit]').forEach((b) => b.addEventListener('click', () => {
  const how = b.dataset.fit;
  editSel((L) => { if (how === 'center') { L.x = CW / 2; L.y = CH / 2; } else fitLayer(L, how); });
}));
$('#ed-flipx').addEventListener('click', () => editSel((L) => { L.flipX = !L.flipX; }));
$('#ed-flipy').addEventListener('click', () => editSel((L) => { L.flipY = !L.flipY; }));

function addLayer(L) {
  flushNudge();
  ed.layers.push(L); ed.sel = L.id;
  commit(); syncPanels(); draw();
}
function duplicateSel() {
  const L = selLayer(); if (!L) return;
  flushNudge();
  const copy = { ...L, id: layerSeq++, copy: (L.copy || 0) + 1, x: L.x + 20, y: L.y + 20 };
  ed.layers.splice(ed.layers.indexOf(L) + 1, 0, copy);
  ed.sel = copy.id;
  commit(); syncPanels(); draw();
  edSay(t('ed.dupDone', { name: layerName(L) }));
}
function deleteSel() {
  const L = selLayer(); if (!L) return;
  flushNudge();
  const i = ed.layers.indexOf(L);
  ed.layers.splice(i, 1);
  const next = ed.layers[Math.max(0, i - 1)];
  ed.sel = next ? next.id : null;
  commit(); syncPanels(); draw();
  edSay(t('ed.delDone', { name: layerName(L) }));
}
$('#ed-dup').addEventListener('click', duplicateSel);
$('#ed-del').addEventListener('click', deleteSel);
$('#ed-add-rect').addEventListener('click', () =>
  addLayer(makeShapeLayer('rect', ed.layers.filter((l) => l.type === 'rect').length + 1)));
$('#ed-add-ellipse').addEventListener('click', () =>
  addLayer(makeShapeLayer('ellipse', ed.layers.filter((l) => l.type === 'ellipse').length + 1)));
$('#ed-add-img').addEventListener('click', () => $('#ed-pick').click());
$('#ed-pick').addEventListener('change', (e) => {
  const fs = [...e.target.files];
  e.target.value = '';
  addLayersFromFiles(fs);
});
// รูปที่เพิ่มเป็นเลเยอร์ใหม่ จะย่อให้พอดีแล้วเหลือ 60% วางกลางธง เหมาะกับตราสัญลักษณ์
async function addLayersFromFiles(list) {
  const files = [...list].filter((f) => IMG_EXT.has(extOf(f.name)) || f.type.startsWith('image/'));
  if (!files.length) { edSay(t('st.noImages'), true); return; }
  flushNudge();
  const failed = [];
  let added = 0;
  for (const f of files) {
    try {
      const img = await loadImage(f);
      const L = makeImageLayer(img.canvas, baseName(f.name));
      fitLayer(L, 'contain');
      L.w *= .6; L.h *= .6;
      ed.layers.push(L); ed.sel = L.id; added++;
    } catch (err) { failed.push(`${f.name} (${errText(err)})`); }
  }
  if (added) { commit(); syncPanels(); draw(); }
  if (failed.length) edSay(t('ed.added', { n: added }) + t('st.failed', { list: failed.join(', ') }), true);
  else edSay(t('ed.added', { n: added }));
}
$('#ed-undo').addEventListener('click', undo);
$('#ed-redo').addEventListener('click', redo);
$('#ed-reset').addEventListener('click', () => {
  const f = ed.flag; if (!f) return;
  flushNudge();
  const L = makeImageLayer(f.baseSrc, f.baseName);
  fitLayer(L, currentMode());
  ed.layers = [L]; ed.sel = L.id;
  commit(); ed.cleanAt = ed.hi;
  syncPanels(); draw();
  edSay(t('ed.resetDone'));
});

// ---- คีย์ลัด ----
dlg.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomAt(1.25); return; }
  if (mod && (e.key === '-' || e.key === '_')) { e.preventDefault(); zoomAt(0.8); return; }
  if (mod && e.key === '0') { e.preventDefault(); fitView(); return; }
  if (e.key === ' ' && !e.target.matches('input, select, textarea, button')) {
    e.preventDefault();
    if (!spaceHeld) { spaceHeld = true; if (!ed.drag) stage.style.cursor = 'grab'; }
    return;
  }
  const textEntry = e.target.matches('input[type=number], input[type=text], select, textarea');
  const inForm = e.target.matches('input, select, textarea');
  if (mod && (key === 'z' || key === 'y')) {
    if (textEntry) return;
    e.preventDefault();
    if (key === 'y' || e.shiftKey) redo(); else undo();
    return;
  }
  if (inForm) return;
  if (mod && key === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (e.key === 'Delete') { e.preventDefault(); deleteSel(); return; }
  const L = selLayer();
  const step = e.shiftKey ? 50 : 10;   // 10 หน่วย = 1 พิกเซลของธงใหญ่
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (L && mv && !e.target.matches('button')) {
    e.preventDefault();
    L.x += mv[0]; L.y += mv[1];
    syncProps(); draw();
    clearTimeout(ed.nudge);
    ed.nudge = setTimeout(() => { commit(); renderLayerList(); }, 400);
  }
});

dlg.addEventListener('keyup', (e) => {
  if (e.key === ' ' && spaceHeld) { spaceHeld = false; if (!ed.drag) stage.style.cursor = 'default'; }
});
addEventListener('blur', () => { spaceHeld = false; });

// ---- เปิด / บันทึก / ปิด ----
function openEditor(f) {
  ed.flag = f;
  ed.layers = f.layers.map((l) => ({ ...l }));
  ed.sel = ed.layers.length ? ed.layers[ed.layers.length - 1].id : null;
  ed.hist = []; ed.hi = -1; ed.cleanAt = -1; ed.drag = null; ed.pinch = null; ed.guides = [];
  touches.clear(); spaceHeld = false;
  view.z = 1; view.cx = CW / 2; view.cy = CH / 2; updateZoomUI();
  commit();
  $('#ed-title').textContent = t('ed.title', { name: fullName(f) ? fullName(f) + '.tga' : t('row.unnamed') });
  edSay('');
  dlg.showModal();
  syncPanels(); draw();
  stage.focus({ preventScroll: true });
}
$('#ed-save').addEventListener('click', () => {
  flushNudge();
  const f = ed.flag;
  if (f) {
    const name = fullName(f) || t('row.unnamed');
    if (ed.hi === ed.cleanAt) {
      // กดเริ่มใหม่แล้วไม่ได้แก้อะไรต่อ = กลับไปจัดรูปตามตัวเลือกด้านบนเหมือนเดิม
      f.layers = [makeImageLayer(f.baseSrc, f.baseName)];
      f.edited = false;
      renderFlag(f); updateBadge(f);
      say(t('st.resetSaved', { name }));
    } else if (ed.hi > 0) {
      f.layers = ed.layers.map((l) => ({ ...l }));
      f.edited = true;
      renderFlag(f); updateBadge(f);
      say(t('st.saved', { name }));
    }
  }
  dlg.close();
});
$('#ed-cancel').addEventListener('click', () => dlg.close());
$('#ed-close').addEventListener('click', () => dlg.close());
dlg.addEventListener('close', () => {
  clearTimeout(ed.nudge); ed.nudge = 0;
  ed.flag = null; ed.drag = null;
});

// ---------- เปลี่ยนภาษา ----------
const langSel = $('#lang-select');
langSel.innerHTML = LANGS.map(([c, name, h]) => `<option value="${c}" lang="${h}">${name}</option>`).join('');
langSel.addEventListener('change', () => setLang(langSel.value));
function setLang(code) {
  lang = HTML_LANG[code] ? code : 'en';
  document.documentElement.lang = HTML_LANG[lang];
  document.title = t('title');
  applyStatic(document);
  $('#ed-close').title = t('ed.close');
  document.querySelectorAll('select.ideo-select').forEach((sel) => {
    const v = sel.value;
    sel.innerHTML = ideoOptions();
    sel.value = v;
  });
  langSel.value = lang;
  say('');
  refresh();
  // จำภาษาไว้ในลิงก์ (#lang=en) บุ๊กมาร์กไว้แล้วเปิดใหม่จะได้ภาษาเดิม
  try { history.replaceState(null, '', '#lang=' + lang); } catch { /* บางที่ห้ามแก้ลิงก์ ไม่เป็นไร */ }
}
addEventListener('hashchange', () => setLang(detectLang()));
setLang(detectLang());
</script>
